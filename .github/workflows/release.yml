name: Publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Check release signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.SNAPLEX_SIGNING_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SNAPLEX_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_CERT_SHA1: ${{ vars.SNAPLEX_SIGNING_CERT_SHA1 }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_CERT_SHA1 SPARKLE_EDDSA_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Required release signing secret or variable is missing: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$SIGNING_CERT_SHA1" =~ ^([0-9A-Fa-f]{40}|([0-9A-Fa-f]{2}:){19}[0-9A-Fa-f]{2})$ ]]; then
            echo "SNAPLEX_SIGNING_CERT_SHA1 must be a 40-character SHA-1 fingerprint." >&2
            exit 1
          fi

      - name: Import stable self-signed code-signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.SNAPLEX_SIGNING_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SNAPLEX_SIGNING_CERTIFICATE_PASSWORD }}
          EXPECTED_CERT_SHA1: ${{ vars.SNAPLEX_SIGNING_CERT_SHA1 }}
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_IDENTITY="SnapLex Stable Code Signing"
          EXPECTED_CERT_SHA1="$(printf '%s' "$EXPECTED_CERT_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          KEYCHAIN_PATH="$RUNNER_TEMP/snaplex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/snaplex-signing.p12"
          CERTIFICATE_PEM_PATH="$RUNNER_TEMP/snaplex-signing.pem"
          CERTIFICATE_DER_PATH="$RUNNER_TEMP/snaplex-signing.cer"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys \
            -passin env:CERTIFICATE_PASSWORD -out "$CERTIFICATE_PEM_PATH"
          openssl x509 -in "$CERTIFICATE_PEM_PATH" -outform DER -out "$CERTIFICATE_DER_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN_PATH" "$CERTIFICATE_DER_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          IDENTITY_LINE="$(security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -F "\"$SIGNING_IDENTITY\"" | head -n 1 || true)"
          ACTUAL_CERT_SHA1="$(printf '%s' "$IDENTITY_LINE" | awk '{print $2}' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_CERT_SHA1" != "$EXPECTED_CERT_SHA1" ]]; then
            echo "Imported identity fingerprint does not match SNAPLEX_SIGNING_CERT_SHA1." >&2
            exit 1
          fi

          echo "SNAPLEX_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SNAPLEX_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SNAPLEX_HARDENED_RUNTIME=1" >> "$GITHUB_ENV"
          echo "SNAPLEX_REQUIRE_STABLE_SIGNING=1" >> "$GITHUB_ENV"
          echo "SNAPLEX_EXPECTED_SIGNING_CERT_SHA1=$EXPECTED_CERT_SHA1" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH" "$CERTIFICATE_PEM_PATH" "$CERTIFICATE_DER_PATH"

      - name: Build and package app
        env:
          SNAPLEX_VERSION: ${{ steps.version.outputs.value }}
          SNAPLEX_BUILD_NUMBER: ${{ steps.version.outputs.value }}
        run: ./scripts/build_app.sh

      - name: Create unnotarized disk image
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_ARCH: ${{ steps.version.outputs.arch }}
        shell: bash
        run: |
          DMG_PATH="$RUNNER_TEMP/SnapLex-${RELEASE_VERSION}-macOS-${RELEASE_ARCH}-unnotarized.dmg"
          hdiutil create -volname SnapLex -srcfolder dist/SnapLex.app -ov -format UDZO "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Generate signed update feed
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/update-feed"
          cp "$DMG_PATH" "$RUNNER_TEMP/update-feed/"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            "$RUNNER_TEMP/update-feed"
          swift scripts/verify_sparkle_feed.swift "$RUNNER_TEMP/update-feed/appcast.xml"
          echo "APPCAST_PATH=$RUNNER_TEMP/update-feed/appcast.xml" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            for asset in "$DMG_PATH" "$APPCAST_PATH"; do
              ASSET_NAME="$(basename "$asset")"
              if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq -- "$ASSET_NAME"; then
                echo "Release asset already exists: $ASSET_NAME"
              else
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" "$APPCAST_PATH" --title "SnapLex $RELEASE_VERSION" --notes-file docs/release-installation.md --generate-notes
          fi

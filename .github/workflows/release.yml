name: Publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Check publishing credentials
        id: credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          present=0
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID SPARKLE_EDDSA_PRIVATE_KEY; do
            if [[ -n "${!name}" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No signing credentials configured; publish an unnotarized DMG manually."
          elif [[ "$present" -eq 7 ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing credentials are incomplete; configure all seven secrets or remove them for manual publishing." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: steps.credentials.outputs.configured == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        shell: bash
        run: |
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/snaplex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          echo "SNAPLEX_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SNAPLEX_HARDENED_RUNTIME=1" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Build and package app
        if: steps.credentials.outputs.configured == 'true'
        env:
          SNAPLEX_VERSION: ${{ steps.version.outputs.value }}
          SNAPLEX_BUILD_NUMBER: ${{ steps.version.outputs.value }}
        run: ./scripts/build_app.sh

      - name: Create and notarize disk image
        if: steps.credentials.outputs.configured == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_ARCH: ${{ steps.version.outputs.arch }}
        shell: bash
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          DMG_PATH="$RUNNER_TEMP/SnapLex-${RELEASE_VERSION}-macOS-${RELEASE_ARCH}.dmg"
          xcrun notarytool store-credentials SnapLexNotary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          hdiutil create -volname SnapLex -srcfolder dist/SnapLex.app -ov -format UDZO "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile SnapLexNotary --wait
          xcrun stapler staple "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Generate signed update feed
        if: steps.credentials.outputs.configured == 'true'
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/update-feed"
          cp "$DMG_PATH" "$RUNNER_TEMP/update-feed/"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            "$RUNNER_TEMP/update-feed"
          swift scripts/verify_sparkle_feed.swift "$RUNNER_TEMP/update-feed/appcast.xml"
          echo "APPCAST_PATH=$RUNNER_TEMP/update-feed/appcast.xml" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            for asset in "$DMG_PATH" "$APPCAST_PATH"; do
              ASSET_NAME="$(basename "$asset")"
              if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq -- "$ASSET_NAME"; then
                echo "Release asset already exists: $ASSET_NAME"
              else
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" "$APPCAST_PATH" --title "SnapLex $RELEASE_VERSION" --notes-file docs/release-installation.md --generate-notes
          fi
